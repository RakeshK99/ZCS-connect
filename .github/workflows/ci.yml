name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (core, mobile, console)
        run: pnpm -r typecheck
      - name: Unit tests (core)
        run: pnpm --filter @zcs/core test
      - name: Build console
        run: pnpm --filter console build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Bundle mobile app (iOS JS)
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-ios
        env:
          EXPO_OFFLINE: 1

  database:
    # Migrations + demo seed + permission tests (allow and deny cases) on a
    # throwaway PostgreSQL with Supabase platform stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Permission tests
        run: supabase/tests/run_local.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --no-config: Edge Functions deploy standalone; don't pick up the pnpm workspace's package.json
      - run: deno check --no-config supabase/functions/deliver/index.ts supabase/functions/calendar-sync/index.ts
      - name: Calendar feed parser tests
        run: deno test --no-config supabase/functions/calendar-sync/
