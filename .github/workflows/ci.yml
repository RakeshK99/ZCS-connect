name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (core, mobile, console)
        run: pnpm -r typecheck
      - name: Unit tests (core)
        run: pnpm --filter @zcs/core test
      - name: Build console
        run: pnpm --filter console build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Bundle mobile app (iOS JS)
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-ios
        env:
          EXPO_OFFLINE: 1

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/deliver/index.ts
